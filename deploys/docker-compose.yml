name: zerde-deploy

services:
  app:
    build:
      context: ..
      dockerfile: deploys/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      SERVE_SITES_IN_APP: "false"
    volumes:
      - sitedata:/data
    restart: unless-stopped
    # The host has 1.9 GB. If the app ever balloons, the kernel kills an app worker (compose restarts
    # it) instead of Caddy, which keeps serving every deployed site from disk.
    mem_limit: 1g

  caddy:
    image: caddy:2.11
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Caddy gets only what its Caddyfile reads, never the app's secrets: these three are interpolated from
    # deploys/.env. The defaults only keep docker-compose.local.yml (no .env, Caddyfile.local) quiet.
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      SITES_DOMAIN: ${SITES_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites.caddy:/etc/caddy/sites.caddy:ro
      - ../frontend/static/site-404.html:/srv/errors/site-404.html:ro
      # Only the deployed sites, read-only: not app.db, its backups or half-staged uploads (Docker >= 26).
      - type: volume
        source: sitedata
        target: /srv/data/sites
        read_only: true
        volume:
          subpath: sites
      - caddy_data:/data
      - caddy_config:/config
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

# IPv6 on the compose network lets Docker forward IPv6 visitors to Caddy with their own address (ip6tables
# NAT). On an IPv4-only network Docker's userland proxy relays them instead, and every IPv6 visitor reaches
# Caddy, and the app's per-IP sign-in limit, from one gateway address.
networks:
  default:
    enable_ipv6: true

volumes:
  sitedata:
  caddy_data:
  caddy_config:
