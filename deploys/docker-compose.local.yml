# Run the production stack locally over plain HTTP on port 8080:
#   cd deploys && docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  app:
    environment:
      APP_DOMAIN: localhost:8080
      SITES_DOMAIN: localhost:8080
      HTTPS: "false"
      SECRET_KEY: local-only-secret-not-for-production
      ADMIN_EMAILS: admin@example.com
  caddy:
    ports: !override
      - "8080:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
  # Load generator for smoke_local.sh (`docker compose ... run --rm loadtest <oha args>`).
  # It sits on the compose network and talks to caddy:80 directly, so Docker Desktop's port
  # forwarder (which resets connections at 1000 connections x ~20k req/s) is not measured.
  loadtest:
    image: ghcr.io/hatoo/oha:1.16.0
    profiles:
      - loadtest
    depends_on:
      - caddy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
